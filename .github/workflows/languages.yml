name: Generate Languages Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Languages SVG
        uses: DenverCoder1/github-readme-stats-action@main
        with:
          username: ${{ github.repository_owner }}
          output: languages.svg
          template: dracula
          hide_title: false
          layout: compact
          card_width: 320
          langs_count: 5
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add languages.svg
          git commit -m "Update languages" || echo "No changes to commit"
          git push origin HEAD:languages-output --force
